<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="Guru Ji minimal text and voice assistant prototype">
  <title>Guru Ji — Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #102a43;
      --navy-soft: #243b53;
      --teal: #147d92;
      --teal-dark: #0b6474;
      --teal-pale: #e8f5f6;
      --orange: #d97732;
      --orange-pale: #fff2e5;
      --ink: #172f46;
      --muted: #71879b;
      --line: #dce6ee;
      --canvas: #f4f8fb;
      --surface: #ffffff;
      --success: #16834e;
      --shadow: 0 18px 55px rgba(16, 42, 67, .09);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--canvas);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: min(100%, 1040px);
      height: 100%;
      min-height: 620px;
      margin: 0 auto;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      color: #fff;
      background: linear-gradient(135deg, #efa766, var(--orange));
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -.08em;
    }
    .brand-name { color: var(--navy); font-size: 16px; font-weight: 850; letter-spacing: -.03em; }
    .brand-subtitle { display: block; margin-top: -2px; color: var(--muted); font-size: 10px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--success);
      background: #e7f7ee;
      border-radius: 99px;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 800;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #58bd87; }

    .chat-history {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 22px;
      overflow-y: auto;
      padding: 34px clamp(20px, 8vw, 105px) 30px;
      background: linear-gradient(180deg, #fbfdfe 0%, #fff 100%);
    }
    .empty-space { flex: 1; min-height: 12px; }
    .message { display: flex; align-items: flex-start; gap: 11px; max-width: 790px; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      flex: none;
      color: #fff;
      background: linear-gradient(135deg, #efa766, var(--orange));
      border-radius: 10px;
      font-size: 10px;
      font-weight: 900;
    }
    .user .avatar { color: var(--teal-dark); background: var(--teal-pale); }
    .message-body { min-width: 0; }
    .message-label {
      display: block;
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .user .message-label { text-align: right; }
    .bubble {
      padding: 12px 15px;
      color: var(--navy-soft);
      background: #f3f7fa;
      border: 1px solid #e7eef3;
      border-radius: 5px 16px 16px 16px;
      font-size: 14px;
    }
    .user .bubble {
      color: #194859;
      background: var(--teal-pale);
      border-color: #d6eeee;
      border-radius: 16px 5px 16px 16px;
    }
    .voice-reply .bubble { background: #fff8f0; border-color: #f5e5d3; }
    .voice-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 7px;
      padding: 3px 7px;
      color: var(--orange);
      background: var(--orange-pale);
      border-radius: 99px;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .composer-wrap {
      padding: 15px clamp(16px, 6vw, 75px) 21px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 8px;
      background: #fff;
      border: 1px solid #cfdde7;
      border-radius: 16px;
      box-shadow: 0 7px 22px rgba(16,42,67,.06);
    }
    .text-input {
      flex: 1;
      min-width: 0;
      height: 43px;
      padding: 0 9px;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 14px;
    }
    .text-input::placeholder { color: #94a8b8; }
    .text-input:focus { box-shadow: none; }
    .send-button, .voice-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 43px;
      border: 0;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 850;
      transition: transform .16s, box-shadow .16s, background .16s;
    }
    .send-button {
      min-width: 77px;
      padding: 0 14px;
      color: #fff;
      background: var(--teal);
    }
    .voice-button {
      min-width: 151px;
      padding: 0 15px;
      color: var(--teal-dark);
      background: var(--teal-pale);
      border: 1px solid #cde8ea;
    }
    .send-button:hover, .voice-button:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(16,42,67,.13); }
    .send-button:hover { background: var(--teal-dark); }
    .voice-button:hover { background: #d9f0f1; }
    .voice-button.listening { color: #fff; background: var(--orange); border-color: var(--orange); }
    .voice-icon { font-size: 17px; line-height: 1; }
    .voice-button.listening .voice-icon { animation: mic-pulse 1.2s infinite; }
    .composer-hint { margin: 8px 3px 0; color: var(--muted); font-size: 10px; text-align: center; }
    .composer-hint kbd { padding: 2px 5px; background: #f3f6f8; border: 1px solid var(--line); border-radius: 4px; font-size: 9px; }
    .voice-status-line { min-height: 17px; margin: 5px 0 0; color: var(--orange); font-size: 10px; font-weight: 750; text-align: center; }
    .voice-status-line:empty { display: none; }
    @keyframes mic-pulse { 50% { transform: scale(1.17); } }

    @media (max-width: 680px) {
      .app { min-height: 100%; }
      .topbar { min-height: 62px; padding: 0 16px; }
      .brand-subtitle { display: none; }
      .status { padding: 5px 8px; font-size: 9px; }
      .chat-history { padding: 24px 15px 24px; }
      .bubble { font-size: 13px; }
      .composer-wrap { padding: 11px 12px 16px; }
      .composer { flex-wrap: wrap; }
      .text-input { flex-basis: calc(100% - 18px); order: 1; }
      .voice-button { order: 2; flex: 1; min-width: 0; }
      .send-button { order: 2; flex: 0 0 78px; }
      .composer-hint { display: none; }
    }
    @media (max-width: 390px) {
      .brand-name { font-size: 15px; }
      .message { max-width: 96%; }
      .voice-button { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">GJ</div>
        <div><div class="brand-name">Guru Ji</div><span class="brand-subtitle">Institutional assistant</span></div>
      </div>
      <div class="status"><span class="status-dot"></span>Ready</div>
    </header>

    <section id="chat-history" class="chat-history" aria-label="Chat history">
      <div class="empty-space"></div>
      <article class="message assistant-message">
        <div class="avatar">GJ</div>
        <div class="message-body"><span class="message-label">Guru Ji</span><div class="bubble">Namaste. I’m ready to help. You can type a message or start the Voice Assistant.</div></div>
      </article>
    </section>

    <section class="composer-wrap" aria-label="Assistant input">
      <div id="voice-status-line" class="voice-status-line" role="status" aria-live="polite"></div>
      <form id="text-form" class="composer">
        <label class="sr-only" for="text-input">Type a message</label>
        <input id="text-input" class="text-input" type="text" autocomplete="off" maxlength="10000" placeholder="Type your message…">
        <button id="voice-button" class="voice-button" type="button" aria-pressed="false"><span class="voice-icon">◉</span><span id="voice-button-label">Voice Assistant</span></button>
        <button class="send-button" type="submit">Send <span>↗</span></button>
      </form>
      <p class="composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift + Enter</kbd> for a new line · voice is demo-only in this prototype</p>
    </section>
  </main>

  <script>
    (() => {
      const state = { listening: false, responding: false };
      const $ = (id) => document.getElementById(id);

      function addMessage(kind, text, voice = false) {
        const article = document.createElement("article");
        article.className = `message ${kind}-message${voice ? " voice-reply" : ""}`;
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = kind === "user" ? "You" : "GJ";
        const body = document.createElement("div");
        body.className = "message-body";
        const label = document.createElement("span");
        label.className = "message-label";
        label.textContent = kind === "user" ? "You" : "Guru Ji";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (voice && kind === "assistant") {
          const tag = document.createElement("span");
          tag.className = "voice-tag";
          tag.textContent = "◉ Voice response";
          bubble.append(tag);
        }
        const copy = document.createElement("div");
        copy.textContent = text;
        bubble.append(copy);
        body.append(label, bubble);
        article.append(avatar, body);
        $("chat-history").append(article);
        $("chat-history").scrollTop = $("chat-history").scrollHeight;
      }

      function answerFor(text) {
        const prompt = text.toLowerCase();
        if (prompt.includes("attendance")) return "The prototype answer is ready: College A attendance is 87% for the current review period.";
        if (prompt.includes("source") || prompt.includes("health")) return "The prototype shows all approved sources as healthy and available for read-only questions.";
        return "I received your message. This standalone prototype demonstrates the conversation flow; the production assistant will connect to approved institutional services.";
      }

      function sendText(text) {
        const value = text.trim();
        if (!value) return;
        addMessage("user", value);
        $("text-input").value = "";
        setTimeout(() => addMessage("assistant", answerFor(value)), 330);
      }

      function renderVoiceState() {
        const button = $("voice-button");
        const label = $("voice-button-label");
        const status = $("voice-status-line");
        button.classList.toggle("listening", state.listening);
        button.setAttribute("aria-pressed", String(state.listening));
        label.textContent = state.listening ? "Stop listening" : "Voice Assistant";
        status.textContent = state.listening ? "Listening in demo mode…" : "";
      }

      function startVoiceAssistant() {
        if (state.listening) return;
        state.listening = true;
        renderVoiceState();
        setTimeout(() => {
          if (!state.listening) return;
          const transcript = "Show me the institutional overview.";
          addMessage("user", transcript, true);
          state.listening = false;
          renderVoiceState();
          state.responding = true;
          setTimeout(() => {
            addMessage("assistant", "Here is the prototype overview: College A has 1,248 active students across 6 departments. This voice response is simulated locally.", true);
            state.responding = false;
          }, 380);
        }, 1100);
      }

      function stopVoiceAssistant() {
        state.listening = false;
        renderVoiceState();
      }

      $("text-form").addEventListener("submit", (event) => {
        event.preventDefault();
        sendText($("text-input").value);
      });
      $("text-input").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendText(event.target.value);
        }
      });
      $("voice-button").addEventListener("click", () => {
        if (state.listening) stopVoiceAssistant();
        else startVoiceAssistant();
      });
    })();
  </script>
</body>
</html>

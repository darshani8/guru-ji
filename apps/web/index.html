<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="Guru Ji institutional text and voice assistant">
  <title>Guru Ji — Assistant</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">GJ</div>
        <div>
          <div class="brand-name">Guru Ji</div>
          <span class="brand-subtitle">Institutional assistant</span>
        </div>
      </div>
      <div id="api-status" class="status neutral" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="api-status-label">Connecting…</span>
      </div>
    </header>

    <section id="chat-history" class="chat-history" aria-label="Chat history">
      <div class="empty-space"></div>
      <article class="message assistant-message">
        <div class="avatar">GJ</div>
        <div class="message-body">
          <span class="message-label">Guru Ji</span>
          <div class="bubble">Namaste. I’m ready to help. You can type a message or start the Voice Assistant.</div>
        </div>
      </article>
    </section>

    <section class="composer-wrap" aria-label="Assistant input">
      <p id="voice-status-line" class="voice-status-line" role="status" aria-live="polite"></p>
      <form id="text-form" class="composer">
        <label class="sr-only" for="text-input">Type a message</label>
        <input id="text-input" class="text-input" type="text" autocomplete="off" maxlength="12000" placeholder="Type your message…">
        <button id="voice-button" class="voice-button" type="button" aria-pressed="false">
          <span class="voice-icon" aria-hidden="true">◉</span>
          <span id="voice-button-label">Voice Assistant</span>
        </button>
        <button id="send-button" class="send-button" type="submit">Send <span aria-hidden="true">↗</span></button>
      </form>
      <p class="composer-hint"><kbd>Enter</kbd> to send · browser speech input/output · final transcripts only reach the server</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>

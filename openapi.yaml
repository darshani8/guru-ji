openapi: 3.1.0
info:
  title: guru-ji-api
  description: Policy-bound, read-only institutional intelligence
  version: 0.1.0
paths:
  /v1/health/live:
    get:
      tags:
      - health
      summary: Check whether the API process is running
      operationId: liveness_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Liveness V1 Health Live Get
  /v1/health/ready:
    get:
      tags:
      - health
      summary: Check whether the local runtime is ready
      operationId: readiness_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readiness V1 Health Ready Get
  /v1/chat:
    post:
      tags:
      - chat
      summary: Chat
      operationId: chat_v1_chat_post
      parameters:
      - name: stream
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/stream:
    post:
      tags:
      - chat
      summary: Chat Stream
      description: 'Return the same policy-bound answer through a stable SSE envelope.


        The current answer envelope is bounded, so it emits one complete answer

        event followed by ``done``. The optional model provider is resolved before

        streaming; future transport chunking must not bypass authorization, audit,

        provenance, or the final response contract.'
      operationId: chat_stream_v1_chat_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/briefings/daily:
    post:
      tags:
      - briefings
      summary: Daily Briefing
      operationId: daily_briefing_v1_briefings_daily_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefingBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Daily Briefing V1 Briefings Daily Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/briefings/recent:
    get:
      tags:
      - briefings
      summary: Recent Briefings
      operationId: recent_briefings_v1_briefings_recent_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Recent Briefings V1 Briefings Recent Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/voice/sessions:
    post:
      tags:
      - voice
      summary: Create Session
      operationId: create_session_v1_voice_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/VoiceSessionBody'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Session V1 Voice Sessions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/voice/sessions/{session_id}:
    delete:
      tags:
      - voice
      summary: Close Session
      operationId: close_session_v1_voice_sessions__session_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                title: Response Close Session V1 Voice Sessions  Session Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources:
    get:
      tags:
      - sources
      summary: List Sources
      operationId: list_sources_v1_sources_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Sources V1 Sources Get
  /v1/research/web:
    post:
      tags:
      - research
      summary: Web Research
      operationId: web_research_v1_research_web_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebResearchBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Web Research V1 Research Web Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/audit/recent:
    get:
      tags:
      - audit
      summary: Recent Audit
      operationId: recent_audit_v1_audit_recent_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Recent Audit V1 Audit Recent Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BriefingBody:
      properties:
        report_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Report Date
        college_id:
          type: string
          title: College Id
          default: college_a
        include_web_context:
          type: boolean
          title: Include Web Context
          default: false
      type: object
      title: BriefingBody
    ChatBody:
      properties:
        prompt:
          type: string
          maxLength: 12000
          minLength: 1
          title: Prompt
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
        source_ids:
          items:
            type: string
          type: array
          title: Source Ids
        channel:
          type: string
          title: Channel
          default: text
        institution_scope:
          $ref: '#/components/schemas/ScopeBody'
      type: object
      required:
      - prompt
      title: ChatBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ScopeBody:
      properties:
        college_id:
          type: string
          title: College Id
          default: college_a
        department_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Department Id
        batch_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Batch Id
      type: object
      title: ScopeBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VoiceSessionBody:
      properties:
        college_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: College Id
        department_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Department Id
        batch_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Batch Id
      type: object
      title: VoiceSessionBody
    WebResearchBody:
      properties:
        query:
          type: string
          maxLength: 500
          minLength: 1
          title: Query
        allowed_domains:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 20
          - type: 'null'
          title: Allowed Domains
        max_results:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Max Results
          default: 5
      type: object
      required:
      - query
      title: WebResearchBody

      summary: Import the staged rows into the canonical database
      operationId: commit_job_v1_ingestion_jobs__job_id__commit_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: institution_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Commit Job V1 Ingestion Jobs  Job Id  Commit Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ingestion/jobs/{job_id}/retry:
    post:
      tags:
      - ingestion
      summary: Re-run a failed or interrupted ingestion job
      description: Queue the job again; a run that is still alive (fresh heartbeat)
        is left untouched unless ``force`` is set.
      operationId: retry_job_v1_ingestion_jobs__job_id__retry_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: institution_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution Id
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Retry Job V1 Ingestion Jobs  Job Id  Retry Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

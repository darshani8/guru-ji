  /v1/ingestion/uploads:
    post:
      tags:
      - ingestion
      summary: Upload an existing institutional file (Excel, CSV, PDF, Word, scan,
        JSON)
      operationId: upload_file_v1_ingestion_uploads_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_v1_ingestion_uploads_post'
        required: true
      responses:
        '200':
          description: Successful Response

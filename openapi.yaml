                type: object
                title: Response Daily Briefing V1 Briefings Daily Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/briefings/recent:
    get:
      tags:
      - briefings
      summary: Recent Briefings
      operationId: recent_briefings_v1_briefings_recent_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Recent Briefings V1 Briefings Recent Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/voice/sessions:
    post:
      tags:
      - voice
      summary: Create Session
      operationId: create_session_v1_voice_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/VoiceSessionBody'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Session V1 Voice Sessions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/voice/sessions/{session_id}:
    delete:
      tags:
      - voice
      summary: Close Session
      operationId: close_session_v1_voice_sessions__session_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                title: Response Close Session V1 Voice Sessions  Session Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources:
    get:
      tags:
      - sources
      summary: List Sources
      operationId: list_sources_v1_sources_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Sources V1 Sources Get
  /v1/research/web:
    post:
      tags:
      - research
      summary: Web Research
      operationId: web_research_v1_research_web_post
      requestBody:
        content:
          application/json:
            schema:

openapi: 3.1.0
info:
  title: guru-ji-api
  description: 'AI-powered institutional intelligence platform: ingestion, canonical
    data, policy-bound agents, and internet intelligence'
  version: 0.1.0
paths:
  /v1/health/live:
    get:
      tags:
      - health
      summary: Check whether the API process is running
      operationId: liveness_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Liveness V1 Health Live Get
  /v1/health/ready:
    get:
      tags:
      - health
      summary: Check whether the local runtime is ready
      operationId: readiness_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readiness V1 Health Ready Get
        '503':
          description: A store is unreachable
  /v1/auth/config:
    get:
      tags:
      - auth
      summary: Describe how the browser client should authenticate
      operationId: auth_config_v1_auth_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Auth Config V1 Auth Config Get
  /v1/chat:
    post:
      tags:
      - chat
      summary: Chat
      operationId: chat_v1_chat_post
      parameters:
      - name: stream
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/stream:
    post:
      tags:
      - chat
      summary: Chat Stream
      description: Return the policy-bound answer through a validated SSE event sequence.
      operationId: chat_stream_v1_chat_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/briefings/daily:
    post:
      tags:
      - briefings
      summary: Daily Briefing
      operationId: daily_briefing_v1_briefings_daily_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefingBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:

                additionalProperties: true
                title: Response Get Job V1 Ingestion Jobs  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ingestion/jobs/{job_id}/records:
    get:
      tags:
      - ingestion
      summary: Staged rows for a job with their normalization and issues
      operationId: job_records_v1_ingestion_jobs__job_id__records_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: institution_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset

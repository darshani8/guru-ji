          anyOf:
          - type: string
          - type: 'null'
          title: Institution Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MappingDecisionBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Decide Mapping V1 Ingestion Jobs  Job Id  Mapping

[project]
name = "agentic-saffron"
version = "0.1.0"
description = "A federated, read-only institutional AI assistant with text and voice channels."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.28,<1.0",
    "orjson>=3.10,<4.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sse-starlette>=2.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "structlog>=25.1,<27.0",
    "tenacity>=9.0,<10.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<3.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=4.0,<5.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest>=9.0.3,<10.0",
    "PyYAML>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]
search = [
    "tavily-python>=0.5,<1.0",
]
voice = [
    "aiortc>=1.10,<2.0",
]
llm = [
    "litellm>=1.60,<2.0",
]
# Claude through the official Anthropic SDK: the Claude API
# (SAFFRON_MODEL_PROVIDER=anthropic) or Amazon Bedrock (SAFFRON_MODEL_PROVIDER=bedrock).
anthropic = [
    "anthropic[bedrock]>=1.8,<2.0",
]
# Richer file parsing for the ingestion layer. The core reader handles CSV, XLSX,
# DOCX, JSON, and text without these; PDFs and legacy .xls need one of them.
ingest = [
    "pdfplumber>=0.11,<1.0",
    "pypdf>=5.0,<7.0",
    "openpyxl>=3.1,<4.0",
    "xlrd>=2.0,<3.0",
]
aws = [
    "boto3>=1.35,<2.0",
]
# Libraries the open-task agent's code sandbox offers the model for building
# files (SAFFRON_OPEN_TASK_ENABLED): Excel, PowerPoint, Word and charts.
open-task = [
    "matplotlib>=3.9,<4.0",
    "openpyxl>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
]

[tool.uv]
# The repository is an application monorepo, not an installable library yet.
# This keeps dependency synchronization independent from the future package layout.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "S", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["apps/api", "apps"]
testpaths = ["tests"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
mypy_path = ["apps/api"]
no_implicit_optional = true
python_version = "3.12"
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

name: lint

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.x"
          enable-cache: true
      - name: Install development tools
        run: uv sync --extra dev
      - name: Check undefined names and imports
        run: uv run ruff check --select F apps/api tests scripts
      - name: Check new validation scripts are formatted
        run: uv run ruff format --check scripts/validate_openapi.py scripts/repository_hygiene.py

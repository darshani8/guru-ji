services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guru_ji
      POSTGRES_USER: guru_ji
      POSTGRES_PASSWORD: guru_ji_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guru_ji -d guru_ji"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - guru-ji-postgres:/var/lib/postgresql/data

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    command: ["server", "--config=/conf/cerbos.yaml"]
    volumes:
      - ../cerbos/cerbos.yaml:/conf/cerbos.yaml:ro
      - ../cerbos/policies:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3592/_cerbos/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "3592:3592"

  connector:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.connector
    environment:
      GURU_CONNECTOR_ENVIRONMENT: development
      GURU_CONNECTOR_SERVICE_TOKEN: connector-dev-token
      GURU_CONNECTOR_SOURCE_ID: college_a_remote
      GURU_CONNECTOR_INSTITUTION_ID: college_a
      GURU_CONNECTOR_ALLOWED_COLLEGE_ID: college_a
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8010:8010"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      GURU_ENVIRONMENT: development
      GURU_DEV_BEARER_TOKEN: dev-token
      GURU_PDP_MODE: cerbos
      GURU_CERBOS_URL: http://cerbos:3592
      GURU_CERBOS_POLICY_VERSION: guru-cerbos-v1
      GURU_CERBOS_REQUIRE_FRESH: "false"
      CONTROL_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      GURU_ENABLE_DEMO_DATA: "false"
      GURU_INSTITUTION_CONNECTOR_BASE_URL: http://connector:8010
      GURU_INSTITUTION_CONNECTOR_AUTH_TOKEN: connector-dev-token
      GURU_CONNECTOR_SCOPE_ATTESTATION_REQUIRED: "true"
      GURU_ALLOWED_ORIGINS: http://localhost:8000,http://localhost:5173
      # Data platform: canonical tables live in the same PostgreSQL, uploads on a volume.
      GURU_PLATFORM_ENABLED: "true"
      INSTITUTION_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      GURU_OBJECT_STORE: local
      GURU_OBJECT_STORE_PATH: /app/data/objects
      GURU_JOB_QUEUE: thread
    depends_on:
      postgres:
        condition: service_healthy
      cerbos:
        condition: service_healthy
      connector:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ../../apps:/app/apps:ro
      - guru-ji-objects:/app/data/objects

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/run_worker.py"]
    environment:
      GURU_ENVIRONMENT: development
      GURU_PDP_MODE: local
      CONTROL_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      INSTITUTION_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      GURU_OBJECT_STORE: local
      GURU_OBJECT_STORE_PATH: /app/data/objects
      GURU_JOB_QUEUE: thread
      GURU_ENABLE_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps:/app/apps:ro
      - ../../scripts:/app/scripts:ro
      - guru-ji-objects:/app/data/objects

  # Scheduled internet monitoring. Opt-in: start it with
  #   docker compose --profile monitor up monitor
  # after setting GURU_INTELLIGENCE_SEARCH_PROVIDER=tavily and the search key.
  monitor:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/run_monitor.py", "--every", "3600"]
    profiles: ["monitor"]
    environment:
      GURU_ENVIRONMENT: development
      GURU_PDP_MODE: local
      CONTROL_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      INSTITUTION_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      GURU_OBJECT_STORE: local
      GURU_OBJECT_STORE_PATH: /app/data/objects
      GURU_JOB_QUEUE: inline
      GURU_INTELLIGENCE_SEARCH_PROVIDER: ${GURU_INTELLIGENCE_SEARCH_PROVIDER:-disabled}
      GURU_WEB_SEARCH_API_KEY: ${GURU_WEB_SEARCH_API_KEY:-}
      # https URL or email for site owners (required in production; may stay empty in development)
      GURU_INTELLIGENCE_CRAWLER_CONTACT: ${GURU_INTELLIGENCE_CRAWLER_CONTACT:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps:/app/apps:ro
      - ../../scripts:/app/scripts:ro
      - guru-ji-objects:/app/data/objects

  # The internet map engine: one tick per institution every 15 minutes; only
  # sources that are due do any work. Opt-in like the monitor:
  #   docker compose --profile monitor up map-engine
  map-engine:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/run_monitor.py", "--map", "--every", "900"]
    profiles: ["monitor"]
    environment:
      GURU_ENVIRONMENT: development
      GURU_PDP_MODE: local
      CONTROL_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      INSTITUTION_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      GURU_OBJECT_STORE: local
      GURU_OBJECT_STORE_PATH: /app/data/objects
      GURU_JOB_QUEUE: inline
      GURU_INTELLIGENCE_MAP_ENABLED: "true"
      GURU_INTELLIGENCE_SEARCH_PROVIDER: ${GURU_INTELLIGENCE_SEARCH_PROVIDER:-disabled}
      GURU_WEB_SEARCH_API_KEY: ${GURU_WEB_SEARCH_API_KEY:-}
      # https URL or email for site owners (required in production; may stay empty in development)
      GURU_INTELLIGENCE_CRAWLER_CONTACT: ${GURU_INTELLIGENCE_CRAWLER_CONTACT:-}
      GURU_INTELLIGENCE_SUPPRESSION_KEY: ${GURU_INTELLIGENCE_SUPPRESSION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps:/app/apps:ro
      - ../../scripts:/app/scripts:ro

  # The internet map's daily digest to each institution's alert recipients
  # (open incidents, the review queue, what was found):
  #   docker compose --profile monitor up map-digest
  map-digest:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/run_monitor.py", "--digest", "--every", "86400"]
    profiles: ["monitor"]
    environment:
      GURU_ENVIRONMENT: development
      GURU_PDP_MODE: local
      CONTROL_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      INSTITUTION_DATABASE_URL: postgresql://guru_ji:guru_ji_dev_only@postgres:5432/guru_ji
      GURU_OBJECT_STORE: local
      GURU_OBJECT_STORE_PATH: /app/data/objects
      GURU_JOB_QUEUE: inline
      GURU_INTELLIGENCE_MAP_ENABLED: "true"
      GURU_INTELLIGENCE_SEARCH_PROVIDER: ${GURU_INTELLIGENCE_SEARCH_PROVIDER:-disabled}
      GURU_WEB_SEARCH_API_KEY: ${GURU_WEB_SEARCH_API_KEY:-}
      # https URL or email for site owners (required in production; may stay empty in development)
      GURU_INTELLIGENCE_CRAWLER_CONTACT: ${GURU_INTELLIGENCE_CRAWLER_CONTACT:-}
      GURU_INTELLIGENCE_SUPPRESSION_KEY: ${GURU_INTELLIGENCE_SUPPRESSION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps:/app/apps:ro
      - ../../scripts:/app/scripts:ro

volumes:
  guru-ji-postgres:
  guru-ji-objects:

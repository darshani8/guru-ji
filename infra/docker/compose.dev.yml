# The internet map's settings, shared by the API (routes, console, review
# decisions), the map engine and the digest, so all three read the same
# connectors, keys, budgets and the one suppression key that fingerprints
# and ownership tokens are keyed on.
x-internet-map: &internet-map
  SAFFRON_INTELLIGENCE_MAP_ENABLED: "true"
  SAFFRON_INTELLIGENCE_SEARCH_PROVIDER: ${SAFFRON_INTELLIGENCE_SEARCH_PROVIDER:-disabled}
  SAFFRON_WEB_SEARCH_API_KEY: ${SAFFRON_WEB_SEARCH_API_KEY:-}
  # https URL or email for site owners (required in production; may stay empty in development)
  SAFFRON_INTELLIGENCE_CRAWLER_CONTACT: ${SAFFRON_INTELLIGENCE_CRAWLER_CONTACT:-}
  SAFFRON_INTELLIGENCE_SUPPRESSION_KEY: ${SAFFRON_INTELLIGENCE_SUPPRESSION_KEY:-}
  SAFFRON_INTELLIGENCE_CONNECTORS: ${SAFFRON_INTELLIGENCE_CONNECTORS:-}
  SAFFRON_INTELLIGENCE_YOUTUBE_API_KEY: ${SAFFRON_INTELLIGENCE_YOUTUBE_API_KEY:-}
  SAFFRON_INTELLIGENCE_INDIANKANOON_TOKEN: ${SAFFRON_INTELLIGENCE_INDIANKANOON_TOKEN:-}
  SAFFRON_INTELLIGENCE_BUDGETS: ${SAFFRON_INTELLIGENCE_BUDGETS:-}
  SAFFRON_INTELLIGENCE_SEED_GROUPS: ${SAFFRON_INTELLIGENCE_SEED_GROUPS:-}
  SAFFRON_INTELLIGENCE_ENTITY_APPROVERS: ${SAFFRON_INTELLIGENCE_ENTITY_APPROVERS:-}
  SAFFRON_INTELLIGENCE_AUTHORITY_CONTACTS: ${SAFFRON_INTELLIGENCE_AUTHORITY_CONTACTS:-}
  SAFFRON_INTELLIGENCE_CERTSPOTTER_TOKEN: ${SAFFRON_INTELLIGENCE_CERTSPOTTER_TOKEN:-}
  SAFFRON_INTELLIGENCE_RETENTION_DAYS: ${SAFFRON_INTELLIGENCE_RETENTION_DAYS:-365}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_saffron
      POSTGRES_USER: agentic_saffron
      POSTGRES_PASSWORD: agentic_saffron_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_saffron -d agentic_saffron"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - agentic-saffron-postgres:/var/lib/postgresql/data

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    command: ["server", "--config=/conf/cerbos.yaml"]
    volumes:
      - ../cerbos/cerbos.yaml:/conf/cerbos.yaml:ro
      - ../cerbos/policies:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3592/_cerbos/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "3592:3592"

  connector:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.connector
    environment:
      SAFFRON_CONNECTOR_ENVIRONMENT: development
      SAFFRON_CONNECTOR_SERVICE_TOKEN: connector-dev-token
      SAFFRON_CONNECTOR_SOURCE_ID: college_a_remote
      SAFFRON_CONNECTOR_INSTITUTION_ID: college_a
      SAFFRON_CONNECTOR_ALLOWED_COLLEGE_ID: college_a
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8010:8010"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      SAFFRON_ENVIRONMENT: development
      SAFFRON_DEV_BEARER_TOKEN: dev-token
      SAFFRON_PDP_MODE: cerbos
      SAFFRON_CERBOS_URL: http://cerbos:3592
      SAFFRON_CERBOS_POLICY_VERSION: guru-cerbos-v1
      SAFFRON_CERBOS_REQUIRE_FRESH: "false"
      CONTROL_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      SAFFRON_ENABLE_DEMO_DATA: "false"
      SAFFRON_INSTITUTION_CONNECTOR_BASE_URL: http://connector:8010
      SAFFRON_INSTITUTION_CONNECTOR_AUTH_TOKEN: connector-dev-token
      SAFFRON_CONNECTOR_SCOPE_ATTESTATION_REQUIRED: "true"
      SAFFRON_ALLOWED_ORIGINS: http://localhost:8000,http://localhost:5173
      # Data platform: canonical tables live in the same PostgreSQL, uploads on a volume.
      SAFFRON_PLATFORM_ENABLED: "true"
      INSTITUTION_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      SAFFRON_OBJECT_STORE: local
      SAFFRON_OBJECT_STORE_PATH: /app/data/objects
      SAFFRON_JOB_QUEUE: thread
      <<: *internet-map
    depends_on:
      postgres:
        condition: service_healthy
      cerbos:
        condition: service_healthy
      connector:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ../../apps:/app/apps:ro
      - agentic-saffron-objects:/app/data/objects

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/run_worker.py"]
    environment:
      SAFFRON_ENVIRONMENT: development
      SAFFRON_PDP_MODE: local
      CONTROL_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      INSTITUTION_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      SAFFRON_OBJECT_STORE: local
      SAFFRON_OBJECT_STORE_PATH: /app/data/objects
      SAFFRON_JOB_QUEUE: thread
      SAFFRON_ENABLE_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps:/app/apps:ro
      - ../../scripts:/app/scripts:ro
      - agentic-saffron-objects:/app/data/objects

  # Scheduled internet monitoring. Opt-in: start it with
  #   docker compose --profile monitor up monitor
  # after setting SAFFRON_INTELLIGENCE_SEARCH_PROVIDER=tavily and the search key.
  monitor:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/run_monitor.py", "--every", "3600"]
    profiles: ["monitor"]
    environment:
      SAFFRON_ENVIRONMENT: development
      SAFFRON_PDP_MODE: local
      CONTROL_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      INSTITUTION_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      SAFFRON_OBJECT_STORE: local
      SAFFRON_OBJECT_STORE_PATH: /app/data/objects
      SAFFRON_JOB_QUEUE: inline
      SAFFRON_INTELLIGENCE_SEARCH_PROVIDER: ${SAFFRON_INTELLIGENCE_SEARCH_PROVIDER:-disabled}
      SAFFRON_WEB_SEARCH_API_KEY: ${SAFFRON_WEB_SEARCH_API_KEY:-}
      # https URL or email for site owners (required in production; may stay empty in development)
      SAFFRON_INTELLIGENCE_CRAWLER_CONTACT: ${SAFFRON_INTELLIGENCE_CRAWLER_CONTACT:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps:/app/apps:ro
      - ../../scripts:/app/scripts:ro
      - agentic-saffron-objects:/app/data/objects

  # The internet map engine: one tick per institution every 15 minutes; only
  # sources that are due do any work. Opt-in like the monitor:
  #   docker compose --profile monitor up map-engine
  map-engine:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/run_monitor.py", "--map", "--every", "900"]
    profiles: ["monitor"]
    environment:
      SAFFRON_ENVIRONMENT: development
      SAFFRON_PDP_MODE: local
      CONTROL_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      INSTITUTION_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      SAFFRON_OBJECT_STORE: local
      SAFFRON_OBJECT_STORE_PATH: /app/data/objects
      SAFFRON_JOB_QUEUE: inline
      <<: *internet-map
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps:/app/apps:ro
      - ../../scripts:/app/scripts:ro

  # The internet map's daily digest to each institution's alert recipients
  # (open incidents, the review queue, what was found). It checks hourly and
  # sends once the last digest is 23 hours old, so a failure is retried soon:
  #   docker compose --profile monitor up map-digest
  map-digest:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "scripts/run_monitor.py", "--digest", "--every", "3600"]
    profiles: ["monitor"]
    environment:
      SAFFRON_ENVIRONMENT: development
      SAFFRON_PDP_MODE: local
      CONTROL_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      INSTITUTION_DATABASE_URL: postgresql://agentic_saffron:agentic_saffron_dev_only@postgres:5432/agentic_saffron
      SAFFRON_OBJECT_STORE: local
      SAFFRON_OBJECT_STORE_PATH: /app/data/objects
      SAFFRON_JOB_QUEUE: inline
      <<: *internet-map
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps:/app/apps:ro
      - ../../scripts:/app/scripts:ro

volumes:
  agentic-saffron-postgres:
  agentic-saffron-objects:
